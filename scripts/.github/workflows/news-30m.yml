name: 30-Min Live AI News Bot

on:
  schedule:
    - cron: '*/30 * * * *' # Executes every 30 minutes
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-generativeai

      - name: Execute News Engine
        run: python scripts/news_bot.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "MediaDB Bot"
          git config --global user.email "bot@mediadb.com"
          git add data/news/
          git commit -m "Auto-update live news via Gemini AI" || exit 0
          git push
