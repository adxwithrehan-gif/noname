<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>CineHub - TMDB Movies, TV Shows & Live World News</title>
  <meta name="description" content="Explore trending movies, TV shows, celebrities, top rated awards, and live global news on CineHub.">
  <meta name="robots" content="index, follow">

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #1a202c;
      --primary: #01b4e4;
      --tmdb-green: #21d07a;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
    }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text); margin: 0; padding: 0; }
    header { background-color: var(--card-bg); padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
    header h1 { margin: 0 0 15px 0; color: var(--primary); font-size: 28px; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    
    /* Search Bar */
    .search-box { display: flex; justify-content: center; margin-bottom: 20px; }
    .search-input { width: 100%; max-width: 500px; padding: 12px 20px; border-radius: 25px; border: 1px solid #2d3748; background: #161e2e; color: #fff; font-size: 16px; outline: none; }
    .search-input:focus { border-color: var(--primary); }

    /* Navigation Tabs */
    .nav-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
    .tab-btn { background: var(--card-bg); color: var(--text); border: 1px solid #2d3748; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-size: 15px; font-weight: 600; transition: all 0.3s ease; }
    .tab-btn.active, .tab-btn:hover { background: var(--primary); color: #000; border-color: var(--primary); }
    
    /* Grid & Cards Layout */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
    .card { background: var(--card-bg); border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s; position: relative; cursor: pointer; display: flex; flex-direction: column; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(1, 180, 228, 0.2); }
    .card img { width: 100%; height: 300px; object-fit: cover; background-color: #2d3748; display: block; }
    .card-info { padding: 15px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 15px; font-weight: bold; margin: 0 0 8px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rating { background: rgba(0,0,0,0.8); color: #ffd700; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: bold; position: absolute; top: 10px; right: 10px; }
    
    /* News Card Styles */
    .news-card { background: var(--card-bg); border-radius: 12px; padding: 15px; border: 1px solid #2d3748; display: flex; flex-direction: column; justify-content: space-between; height: 100%; box-sizing: border-box; }
    .news-title { font-size: 15px; font-weight: bold; color: var(--primary); text-decoration: none; margin-bottom: 10px; display: block; line-height: 1.4; }
    .news-desc { font-size: 13px; color: #cbd5e1; margin-bottom: 12px; line-height: 1.5; }
    .news-date { font-size: 11px; color: var(--text-muted); }

    /* TMDB POPUP MODAL STYLES */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 2000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box; }
    .modal-content { background: #0d1117; border-radius: 12px; max-width: 1000px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; border: 1px solid #30363d; color: #fff; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 32px; color: #fff; cursor: pointer; z-index: 10; font-weight: bold; }
    
    /* Hero Banner Layout */
    .tmdb-hero { position: relative; background-size: cover; background-position: center; display: flex; gap: 30px; padding: 40px; background-blend-mode: overlay; background-color: rgba(10, 15, 25, 0.90); align-items: center; border-radius: 12px; }
    .tmdb-poster { width: 250px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.8); flex-shrink: 0; }
    .tmdb-details { flex-grow: 1; }
    .tmdb-title { font-size: 32px; font-weight: 700; margin: 0 0 8px 0; }
    .tmdb-title span { font-weight: 400; color: #94a3b8; }
    .tmdb-meta { display: flex; gap: 12px; font-size: 14px; color: #cbd5e1; margin-bottom: 20px; align-items: center; flex-wrap: wrap; }
    .certification { border: 1px solid #64748b; padding: 2px 6px; border-radius: 4px; font-size: 12px; color: #94a3b8; }
    
    /* Action Bar & Score Circle */
    .action-bar { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
    .score-box { display: flex; align-items: center; gap: 10px; font-weight: bold; }
    .score-circle { width: 52px; height: 52px; border-radius: 50%; background: #081c22; border: 4px solid var(--tmdb-green); display: flex; justify-content: center; align-items: center; font-size: 16px; color: #fff; font-weight: bold; }
    .trailer-btn { background: #01b4e4; border: none; color: #000; padding: 10px 20px; border-radius: 20px; font-size: 15px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; text-decoration: none; }
    .trailer-btn:hover { background: #008cb3; }
    
    .tagline { font-style: italic; color: #94a3b8; font-size: 16px; margin-bottom: 15px; }
    .overview-title { font-size: 20px; font-weight: bold; margin: 0 0 8px 0; }
    .overview-text { line-height: 1.6; color: #e2e8f0; font-size: 15px; margin-bottom: 20px; }
    .crew-info h4 { margin: 0; font-size: 16px; color: #fff; }
    .crew-info p { margin: 2px 0 0 0; font-size: 13px; color: #94a3b8; }

    .loader { text-align: center; grid-column: 1 / -1; padding: 40px; color: var(--primary); font-size: 18px; }
    .error { text-align: center; grid-column: 1 / -1; color: #fc8181; padding: 20px; }

    @media (max-width: 768px) {
      .tmdb-hero { flex-direction: column; text-align: center; padding: 20px; }
      .tmdb-poster { width: 180px; margin: 0 auto; }
      .action-bar { justify-content: center; }
    }
  </style>
</head>
<body>

  <header>
    <h1>CineHub - TMDB & Live World News</h1>
    <!-- Live Search Bar -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Search Movies, TV Shows, People..." onkeyup="handleSearch(event)">
    </div>
  </header>

  <div class="container">
    <!-- All 5 Navigation Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="loadContent('movie', this)">Trending Movies</button>
      <button class="tab-btn" onclick="loadContent('tv', this)">TV Shows</button>
      <button class="tab-btn" onclick="loadContent('person', this)">Popular People</button>
      <button class="tab-btn" onclick="loadContent('awards', this)">Top Rated (Awards)</button>
      <button class="tab-btn" onclick="loadContent('news', this)">🔴 Live World News</button>
    </div>

    <!-- Main Content Area -->
    <main id="contentGrid" class="grid"></main>
  </div>

  <!-- TMDB Style Popup Modal -->
  <div id="detailModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalData"></div>
    </div>
  </div>

  <script>
    const API_KEY = 'e0454b55527f15c2784604a0bc84df14'; 
    const BASE_URL = 'https://api.themoviedb.org/3';
    const IMG_URL = 'https://image.tmdb.org/t/p/w500';
    const BACKDROP_URL = 'https://image.tmdb.org/t/p/w1280';
    const grid = document.getElementById('contentGrid');
    let newsTimer = null;

    function loadContent(type, clickedBtn = null) {
      if(clickedBtn) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        clickedBtn.classList.add('active');
      }

      clearInterval(newsTimer);

      if (type === 'news') {
        fetchLiveNews();
        newsTimer = setInterval(fetchLiveNews, 30000); 
      } else {
        fetchTMDBData(type);
      }
    }

    // Fetch TMDB Data
    async function fetchTMDBData(type) {
      grid.innerHTML = '<div class="loader">Loading latest content...</div>';

      let url = `${BASE_URL}/trending/movie/day?api_key=${API_KEY}`;
      if (type === 'tv') url = `${BASE_URL}/trending/tv/day?api_key=${API_KEY}`;
      if (type === 'person') url = `${BASE_URL}/person/popular?api_key=${API_KEY}`;
      if (type === 'awards') url = `${BASE_URL}/movie/top_rated?api_key=${API_KEY}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        renderTMDBCards(data.results, type);
      } catch (err) {
        grid.innerHTML = '<div class="error">Failed to load content.</div>';
      }
    }

    // Fetch Live World News
    async function fetchLiveNews() {
      grid.innerHTML = '<div class="loader">Fetching Live World News Feed...</div>';
      const rssUrl = encodeURIComponent('https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en');

      try {
        const res = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}`);
        const data = await res.json();
        renderNewsCards(data.items);
      } catch (err) {
        grid.innerHTML = '<div class="error">Failed to fetch news feed.</div>';
      }
    }

    // Live Search
    async function handleSearch(event) {
      const query = event.target.value.trim();
      if (query.length < 2) return;

      clearInterval(newsTimer);
      grid.innerHTML = '<div class="loader">Searching...</div>';
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      try {
        const res = await fetch(`${BASE_URL}/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`);
        const data = await res.json();
        renderTMDBCards(data.results, 'search');
      } catch (err) {
        grid.innerHTML = '<div class="error">Search request failed.</div>';
      }
    }

    // Render TMDB Cards
    function renderTMDBCards(items, type) {
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="error">No results found.</div>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const title = item.title || item.name;
        const imgPath = item.poster_path || item.profile_path;
        const img = imgPath ? (IMG_URL + imgPath) : 'https://placehold.co/500x750/2d3748/fff?text=No+Image';
        const mediaType = item.media_type || (type === 'awards' ? 'movie' : type);
        const rating = item.vote_average ? `<div class="rating">⭐ ${(item.vote_average).toFixed(1)}</div>` : '';

        return `
          <div class="card" onclick="openDetails('${mediaType}', ${item.id})">
            ${rating}
            <img src="${img}" alt="${title}" loading="lazy">
            <div class="card-info">
              <h3 class="card-title">${title}</h3>
            </div>
          </div>
        `;
      }).join('');
    }

    // Render News Cards
    function renderNewsCards(items) {
      if (!items || items.length === 0) {
        grid.innerHTML = '<div class="error">No news available.</div>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const desc = item.description ? item.description.replace(/<[^>]*>?/gm, '').slice(0, 110) : '';
        return `
          <div class="news-card">
            <div>
              <a href="${item.link}" target="_blank" rel="noopener" class="news-title">${item.title}</a>
              <div class="news-desc">${desc}...</div>
            </div>
            <div class="news-date">📅 ${new Date(item.pubDate).toLocaleString()}</div>
          </div>
        `;
      }).join('');
    }

    // Open TMDB Exact Style Details Popup
    async function openDetails(mediaType, id) {
      const modal = document.getElementById('detailModal');
      const modalData = document.getElementById('modalData');
      
      // Update URL Hash for SEO / State sharing
      window.location.hash = `${mediaType}/${id}`;
      
      modal.style.display = 'flex';
      modalData.innerHTML = '<div class="loader">Loading movie details...</div>';

      try {
        const res = await fetch(`${BASE_URL}/${mediaType}/${id}?api_key=${API_KEY}&append_to_response=videos,credits`);
        const data = await res.json();

        const title = data.title || data.name;
        const year = (data.release_date || data.first_air_date || '').split('-')[0];
        const poster = data.poster_path ? IMG_URL + data.poster_path : 'https://placehold.co/500x750/2d3748/fff?text=No+Image';
        const backdrop = data.backdrop_path ? BACKDROP_URL + data.backdrop_path : '';
        const score = data.vote_average ? Math.round(data.vote_average * 10) : 0;
        const genres = data.genres ? data.genres.map(g => g.name).join(', ') : 'N/A';
        const tagline = data.tagline || '';
        const overview = data.overview || data.biography || 'No details available.';
        
        const trailer = data.videos?.results?.find(v => v.type === 'Trailer' || v.type === 'Teaser');
        const trailerUrl = trailer ? `https://www.youtube.com/watch?v=${trailer.key}` : '';

        const director = data.credits?.crew?.find(c => c.job === 'Director' || c.job === 'Executive Producer')?.name || 'N/A';

        modalData.innerHTML = `
          <div class="tmdb-hero" style="background-image: url('${backdrop}');">
            <img src="${poster}" class="tmdb-poster" alt="${title}">
            <div class="tmdb-details">
              <h1 class="tmdb-title">${title} <span>(${year || 'N/A'})</span></h1>
              <div class="tmdb-meta">
                <span class="certification">TV-MA / PG-13</span>
                <span>${genres}</span>
              </div>

              <div class="action-bar">
                <div class="score-box">
                  <div class="score-circle">${score}%</div>
                  <div>User<br>Score</div>
                </div>
                ${trailerUrl ? `<a href="${trailerUrl}" target="_blank" class="trailer-btn">▶ Play Trailer</a>` : ''}
              </div>

              ${tagline ? `<div class="tagline">"${tagline}"</div>` : ''}
              
              <div class="overview-title">Overview</div>
              <p class="overview-text">${overview}</p>

              <div class="crew-info">
                <h4>${director}</h4>
                <p>Creator / Director</p>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        modalData.innerHTML = '<div class="error">Failed to load details.</div>';
      }
    }

    function closeModal() {
      document.getElementById('detailModal').style.display = 'none';
      history.pushState("", document.title, window.location.pathname + window.location.search);
    }

    window.onclick = function(e) {
      if (e.target == document.getElementById('detailModal')) closeModal();
    }

    // Initial Load
    loadContent('movie');
  </script>
</body>
</html>
