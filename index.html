<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaDB - Movies, TV Shows, Celebrities, Awards & Global News</title>
  <meta name="description" content="Worldwide database for Movies, TV Shows, Celebrities, Awards, and Automated AI Trends News.">
  <link rel="stylesheet" href="css/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script>
</head>
<body>

  <div class="ad-container header-ad" id="ad-header">
    </div>

  <header class="main-header">
    <div class="logo">Media<span>DB</span></div>
    
    <div class="search-container">
      <input type="text" id="searchInput" placeholder="Search Movies, TV Shows, People, News..." onkeyup="handleLiveSearch(event)">
      <button onclick="executeSearch()">Search</button>
    </div>

    <nav class="nav-links">
      <button class="nav-btn active" onclick="switchPage('movies', this)">Movies/Web Series</button>
      <button class="nav-btn" onclick="switchPage('tv', this)">TV Shows</button>
      <button class="nav-btn" onclick="switchPage('people', this)">Popular People</button>
      <button class="nav-btn" onclick="switchPage('rewards', this)">Rewards / Top Rated</button>
      <button class="nav-btn" onclick="switchPage('news', this)">🔴 Live AI News</button>
    </nav>
  </header>

  <div id="newsFilterBar" class="news-filter-bar" style="display: none;">
    <select id="filterCountry" onchange="applyNewsFilters()">
      <option value="US">Worldwide / USA</option>
      <option value="PK">Pakistan</option>
      <option value="IN">India</option>
      <option value="GB">United Kingdom</option>
    </select>

    <select id="filterCategory" onchange="applyNewsFilters()">
      <option value="all">All Categories</option>
      <option value="entertainment">Entertainment</option>
      <option value="tech">Technology</option>
      <option value="sports">Sports</option>
    </select>

    <input type="date" id="filterDate" onchange="applyNewsFilters()">
  </div>

  <main class="container">
    <div id="contentArea" class="data-grid"></div>
  </main>

  <div class="ad-container article-ad" id="ad-article">
    </div>

  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="subscribe-box">
        <h3>Subscribe to MediaDB Updates</h3>
        <div class="sub-form">
          <input type="email" id="subEmail" placeholder="Enter your email address..." required>
          <button onclick="handleSubscribe()">Subscribe</button>
        </div>
        <p id="subStatus" class="sub-status"></p>
      </div>
    </div>
    
    <div class="ad-container footer-ad" id="ad-footer">
      </div>

    <p class="copyright">&copy; 2026 MediaDB. Powered by TMDB & Google Trends AI Automation.</p>
  </footer>

  <script src="js/ads.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
